<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>短劇《復仇》觀眾投稿</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --ink: #FFFDF6;
      --yellow: #FFD166;
      --field-bg: #1a1a1a;
      --line: rgba(255, 250, 235, .22);
      --error: #ff6b6b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); }
    body {
      min-height: 100vh;
      color: var(--ink);
      font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    main { max-width: 560px; margin: 0 auto; padding: 20px 18px 48px; }
    h1 { font-size: 22px; font-weight: 800; line-height: 1.4; margin: 2px 0 14px; }
    .notice {
      background: rgba(255, 209, 102, .12);
      border: 1.5px solid var(--yellow);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.6;
      color: var(--yellow);
      margin-bottom: 22px;
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 8px; font-size: 15px; font-weight: 700; color: var(--ink);
    }
    .field .count { font-size: 13px; font-weight: 400; color: rgba(255, 253, 246, .6); font-variant-numeric: tabular-nums; }
    .field .count.over { color: var(--yellow); }
    input[type="text"], select {
      width: 100%; font-size: 17px; padding: 14px 12px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--field-bg); color: var(--ink);
      outline: none; font-family: inherit; -webkit-appearance: none; appearance: none;
    }
    input[type="text"]:focus, select:focus { border-color: var(--yellow); }
    .photo-box {
      border: 1px solid var(--line); border-radius: 10px; padding: 14px;
      display: flex; gap: 14px; align-items: center; background: var(--field-bg);
    }
    .photo-box img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; background: #000; }
    .photo-box .photo-hint { flex: 1; color: rgba(255, 253, 246, .55); font-size: 13px; line-height: 1.6; }
    .photo-box button {
      border: 1.5px solid var(--yellow); border-radius: 10px; padding: 12px 16px;
      background: transparent; color: var(--yellow); font-size: 15px; font-weight: 700;
    }
    .field-error { margin-top: 6px; color: var(--error); font-size: 14px; font-weight: 700; min-height: 1em; }
    #submitBtn {
      display: block; width: 100%; min-height: 54px; margin-top: 8px; padding: 16px 0;
      border: none; border-radius: 12px; background: var(--yellow); color: #1a1200;
      font-size: 18px; font-weight: 800; font-family: inherit;
    }
    #submitBtn:disabled { opacity: .55; }
    #formError { margin-top: 12px; color: var(--error); font-size: 14px; font-weight: 700; text-align: center; min-height: 1em; }
    .panel { display: none; text-align: center; padding: 56px 12px; }
    .panel h2 { font-size: 24px; margin-bottom: 10px; }
    .panel p { color: rgba(255, 253, 246, .65); font-size: 15px; line-height: 1.8; }
    .panel button {
      margin-top: 20px; border: 1.5px solid var(--yellow); border-radius: 10px;
      padding: 12px 20px; background: transparent; color: var(--yellow); font-size: 15px; font-weight: 700;
    }
    body[data-state="form"] #formPanel { display: block; }
    body[data-state="done"] #donePanel { display: block; }
    body[data-state="closed"] #closedPanel { display: block; }
    body[data-state="unconfigured"] #unconfiguredPanel { display: block; }
    body[data-state="repeat"] #repeatPanel { display: block; }
    #formPanel { display: none; }
  </style>
</head>
<body data-state="form">
  <main>
    <div id="formPanel">
      <h1>回答這些問題，讓我們更了解你吧！</h1>
      <div class="notice">請在開演前 2 分鐘完成投稿，請注意你的答案（和照片）有可能會出現在螢幕上，⚠️ 拜託大家注意不要有任何不雅內容。全部欄位都要填，送出後就不能修改囉！</div>

      <div class="field">
        <label for="table">1. 你坐哪桌？</label>
        <select id="table" required>
          <option value="">請選擇</option>
        </select>
        <div class="field-error" data-error="table"></div>
      </div>

      <div class="field">
        <label for="nick">2. 你的暱稱？ <span class="count" data-count="nick">0/8</span></label>
        <input type="text" id="nick" data-limit="8" autocomplete="off">
        <div class="field-error" data-error="nick"></div>
      </div>

      <div class="field">
        <label for="song">3. 你在 KTV 大家都聽過的拿手歌是什麼？ <span class="count" data-count="song">0/15</span></label>
        <input type="text" id="song" data-limit="15" autocomplete="off">
        <div class="field-error" data-error="song"></div>
      </div>

      <div class="field">
        <label for="dislikedFood">4. 你最討厭吃的東西是什麼？ <span class="count" data-count="dislikedFood">0/15</span></label>
        <input type="text" id="dislikedFood" data-limit="15" autocomplete="off">
        <div class="field-error" data-error="dislikedFood"></div>
      </div>

      <div class="field">
        <label>5. 你手機裡最新拍攝的一張照片</label>
        <div class="photo-box">
          <img id="photoPreview" alt="" hidden>
          <div class="photo-hint" id="photoHint">照片會完整出現在螢幕上。</div>
          <button type="button" id="photoBtn">選照片</button>
          <input type="file" id="photoInput" accept="image/*" hidden>
        </div>
        <div class="field-error" data-error="photo"></div>
      </div>

      <div class="field">
        <label for="worldMessage">6. 一句會讓你感到興奮的話 <span class="count" data-count="worldMessage">0/15</span></label>
        <input type="text" id="worldMessage" data-limit="15" autocomplete="off">
        <div class="field-error" data-error="worldMessage"></div>
      </div>

      <div class="field">
        <label for="parentTrip">7. 你現在最想瞬間移動到哪裡？ <span class="count" data-count="parentTrip">0/15</span></label>
        <input type="text" id="parentTrip" data-limit="15" autocomplete="off">
        <div class="field-error" data-error="parentTrip"></div>
      </div>

      <div class="field">
        <label for="shyQuestion">8. 你因為太羞恥而不敢問出口的問題是？ <span class="count" data-count="shyQuestion">0/15</span></label>
        <input type="text" id="shyQuestion" data-limit="15" autocomplete="off">
        <div class="field-error" data-error="shyQuestion"></div>
      </div>

      <div class="field">
        <label for="impossibleJob">9. 最不可能存在的職業名稱是什麼？ <span class="count" data-count="impossibleJob">0/15</span></label>
        <input type="text" id="impossibleJob" data-limit="15" autocomplete="off">
        <div class="field-error" data-error="impossibleJob"></div>
      </div>

      <button id="submitBtn" disabled>送出投稿</button>
      <div id="formError" role="status"></div>
    </div>

    <div class="panel" id="donePanel">
      <h2>投稿完成 🎭</h2>
      <p>你的答案已經進入劇組口袋。<br>如果演出中聽到熟悉的字句，請保持鎮定。</p>
    </div>

    <div class="panel" id="repeatPanel">
      <h2>你已投稿過</h2>
      <p>這支手機已經送出過一份答案。<br>基本上一人一份就好。</p>
      <button id="againBtn">我要再投一份</button>
    </div>

    <div class="panel" id="closedPanel">
      <h2>投稿已截止</h2>
      <p>演出即將開始，答案已封箱。<br>請關掉手機，好好看戲。</p>
    </div>

    <div class="panel" id="unconfiguredPanel">
      <h2>尚未開放</h2>
      <p>工作人員還沒完成後台設定。<br>（firebase-config.js 仍是佔位值）</p>
    </div>
  </main>

  <!-- 投稿頁刻意不載 Firebase SDK：SDK 會佔一條常駐連線，免費方案每專案只有 100 條，
       觀眾同時開頁會爆。改用 REST（送出瞬間打一次 HTTP，不佔線），常駐連線留給投影頁。 -->
  <script src="firebase-config.js"></script>
  <script>
  'use strict';
  const $ = (s) => document.querySelector(s);
  const TEXT_FIELDS = ['song', 'dislikedFood', 'worldMessage', 'parentTrip', 'shyQuestion', 'impossibleJob'];
  const STORAGE_KEY = 'improv-waiyu-submitted';
  const PHOTO_MAX_CHARS = 512000;

  const state = { photoDataUrl: null, composing: new Set() };

  function codePointLength(value) { return Array.from(String(value ?? '')).length; }

  function setState(name) { document.body.dataset.state = name; }

  // 桌號 B1–B32
  const tableSelect = $('#table');
  for (let n = 1; n <= 32; n += 1) {
    const option = document.createElement('option');
    option.value = 'B' + n;
    option.textContent = 'B' + n;
    tableSelect.appendChild(option);
  }

  // 字數限制：Array.from 算 code points；中文輸入法組字中不截斷，compositionend 才收斂
  function attachLimiter(input) {
    const limit = Number(input.dataset.limit);
    const counter = document.querySelector(`[data-count="${input.id}"]`);
    function enforce() {
      if (state.composing.has(input.id)) { render(); return; }
      const points = Array.from(input.value);
      if (points.length > limit) input.value = points.slice(0, limit).join('');
      render();
    }
    function render() {
      const length = codePointLength(input.value);
      counter.textContent = `${length}/${limit}`;
      counter.classList.toggle('over', length >= limit);
      refreshSubmit();
    }
    input.addEventListener('compositionstart', () => state.composing.add(input.id));
    input.addEventListener('compositionend', () => { state.composing.delete(input.id); enforce(); });
    input.addEventListener('input', enforce);
    render();
  }
  document.querySelectorAll('input[data-limit]').forEach(attachLimiter);

  function fieldValues() {
    const values = { table: tableSelect.value, nick: $('#nick').value.trim() };
    TEXT_FIELDS.forEach((field) => { values[field] = $('#' + field).value.trim(); });
    return values;
  }

  function formComplete() {
    const values = fieldValues();
    if (!values.table) return false;
    if (codePointLength(values.nick) < 1 || codePointLength(values.nick) > 8) return false;
    for (const field of TEXT_FIELDS) {
      const length = codePointLength(values[field]);
      if (length < 1 || length > 15) return false;
    }
    return Boolean(state.photoDataUrl);
  }

  function refreshSubmit() { $('#submitBtn').disabled = !formComplete(); }
  tableSelect.addEventListener('change', refreshSubmit);

  // 照片：canvas 重繪（長邊 1280、JPEG 0.72）→ 方向由瀏覽器 EXIF 校正後的像素為準
  $('#photoBtn').addEventListener('click', () => $('#photoInput').click());
  $('#photoInput').addEventListener('change', async (event) => {
    const file = event.target.files && event.target.files[0];
    const errorSlot = document.querySelector('[data-error="photo"]');
    errorSlot.textContent = '';
    if (!file) return;
    try {
      const dataUrl = await compressPhoto(file);
      if (dataUrl.length > PHOTO_MAX_CHARS) {
        state.photoDataUrl = null;
        $('#photoPreview').hidden = true;
        errorSlot.textContent = '照片太大，請換一張（或先截圖再選）';
      } else {
        state.photoDataUrl = dataUrl;
        const preview = $('#photoPreview');
        preview.src = dataUrl;
        preview.hidden = false;
        $('#photoHint').textContent = '已選好，照片會完整出現在螢幕上。';
      }
    } catch (_) {
      state.photoDataUrl = null;
      $('#photoPreview').hidden = true;
      errorSlot.textContent = '這張照片讀不進來，請換一張';
    }
    refreshSubmit();
  });

  async function compressPhoto(file) {
    const objectUrl = URL.createObjectURL(file);
    try {
      const image = new Image();
      image.src = objectUrl;
      // 不用 image.decode()：Safari 對大 JPEG 有偶發 EncodingError、背景分頁可能懸置；
      // onload 後 drawImage 一樣拿得到 EXIF 校正後的像素
      if (!image.complete || !image.naturalWidth) {
        await new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = () => reject(new Error('image load failed'));
        });
      }
      const longEdge = Math.max(image.naturalWidth, image.naturalHeight);
      if (!longEdge) throw new Error('empty image');
      const scale = Math.min(1, 1280 / longEdge);
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
      canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.72);
    } finally {
      URL.revokeObjectURL(objectUrl);
    }
  }

  // 投稿狀態：REST GET control/submitOpen
  const restBase = typeof improvRestBase === 'function' ? improvRestBase() : null;

  async function submitOpen() {
    const res = await fetch(`${restBase}/rooms/${ROOM}/control/submitOpen.json`);
    if (!res.ok) throw new Error('control read failed');
    return (await res.json()) === true;
  }

  async function boot() {
    if (!restBase) { setState('unconfigured'); return; }
    try {
      if (!(await submitOpen())) { setState('closed'); return; }
    } catch (_) { /* 讀不到開關就先讓觀眾填，送出時規則會把關 */ }
    if (localStorage.getItem(STORAGE_KEY)) setState('repeat');
  }

  $('#againBtn').addEventListener('click', () => setState('form'));

  $('#submitBtn').addEventListener('click', async () => {
    if (!formComplete()) return;
    const button = $('#submitBtn');
    const formError = $('#formError');
    button.disabled = true;
    formError.textContent = '';
    const body = { ...fieldValues(), photo: state.photoDataUrl, ts: { '.sv': 'timestamp' } };
    try {
      const res = await fetch(`${restBase}/rooms/${ROOM}/responses.json`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        let stillOpen = true;
        try { stillOpen = await submitOpen(); } catch (_) {}
        if (!stillOpen) { setState('closed'); return; }
        throw new Error('write rejected');
      }
      try { localStorage.setItem(STORAGE_KEY, String(Date.now())); } catch (_) {}
      setState('done');
    } catch (_) {
      formError.textContent = '送出失敗，請確認網路後再按一次';
      button.disabled = false;
    }
  });

  boot();
  </script>
</body>
</html>
