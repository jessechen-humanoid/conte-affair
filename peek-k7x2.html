<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>後台偷看</title>
  <style>
    :root { --bg:#0a0a0a; --ink:#FFFDF6; --yellow:#FFD166; --card:#141414; --line:rgba(255,250,235,.16); --muted:rgba(255,253,246,.55); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; }
    main { max-width:1100px; margin:0 auto; padding:16px 18px 48px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 0 14px; }
    h1 { margin:0; font-size:20px; font-weight:800; }
    #status { color:var(--muted); font-size:13px; line-height:1.5; }
    #status b { color:var(--yellow); font-weight:800; }
    button { border:1.5px solid var(--yellow); border-radius:10px; padding:10px 14px; background:transparent; color:var(--yellow); font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; }
    button:active { background:rgba(255,209,102,.15); }
    #tabs { display:grid; grid-template-columns:repeat(8, minmax(0,1fr)); gap:8px; margin-bottom:14px; }
    #tabs button { display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px; border-color:var(--line); color:var(--muted); background:var(--card); }
    #tabs button .badge { display:inline-grid; place-items:center; min-width:28px; height:28px; padding:0 8px; border-radius:8px; background:rgba(255,253,246,.1); color:var(--ink); font-size:14px; font-weight:900; }
    #tabs button .cue { font-size:12px; font-weight:900; letter-spacing:.06em; white-space:nowrap; }
    #tabs button.active { border-color:var(--yellow); background:rgba(255,209,102,.14); color:var(--yellow); }
    #tabs button.active .badge { background:var(--yellow); color:#1a1200; }
    section { border:1px solid var(--line); border-radius:12px; background:var(--card); overflow:hidden; }
    section > .head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px 14px 14px; font-size:17px; font-weight:800;
      border-left:6px solid var(--yellow); background:rgba(255,209,102,.14); }
    section > .head .ttl { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    section > .head .badge { display:inline-grid; place-items:center; min-width:30px; height:30px; padding:0 8px; border-radius:8px; background:var(--yellow); color:#1a1200; font-size:15px; font-weight:900; }
    section > .head .cue { color:var(--yellow); font-size:14px; font-weight:900; letter-spacing:.08em; }
    section > .head small { color:var(--muted); font-weight:600; font-size:12px; flex:none; }
    .body { border-top:1px solid var(--line); }
    .rows { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); }
    .row { display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:10px 16px; border-bottom:1px solid rgba(255,250,235,.06); border-right:1px solid rgba(255,250,235,.06); font-size:18px; line-height:1.4; }
    .row .meta { flex:none; color:var(--muted); font-size:12px; }
    .row .ans { overflow-wrap:anywhere; }
    .empty { padding:16px; color:var(--muted); font-size:14px; }
    .photo-gate { padding:16px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; padding:14px; }
    .grid figure { margin:0; }
    .grid img { display:block; width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; background:#000; }
    .grid figcaption { margin-top:4px; color:var(--muted); font-size:12px; text-align:center; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    #notice { display:none; margin:0 0 14px; padding:12px 14px; border:1.5px solid var(--yellow); border-radius:10px; color:var(--yellow); font-size:14px; font-weight:700; line-height:1.6; }
    #notice.show { display:block; }
    .hint { margin-top:10px; color:var(--muted); font-size:12px; }
    @media (max-width: 720px) { #tabs { grid-template-columns:repeat(4, minmax(0,1fr)); } .row { font-size:16px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>後台偷看 · 短劇《復仇》</h1>
        <div id="status">連線中…</div>
      </div>
      <button id="reshuffleBtn" type="button">換一批</button>
    </header>
    <div id="notice"></div>
    <nav id="tabs" aria-label="題目切換"></nav>
    <div id="sections"></div>
    <div class="hint">鍵盤 1–8 切換題目、0 看名單、R 換一批</div>
  </main>

  <script src="firebase-config.js"></script>
  <script>
  'use strict';
  const SAMPLE_SIZE = 30;
  // 依即興劇 cue 順序 1–8；2 與 8 共用同一欄位（worldMessage），合併成一區避免重複
  const SECTIONS = Object.freeze([
    { key: 'parentTrip',    badge: '1',    cue: 'MAP',           title: '最想瞬間移動到哪裡',     field: 'parentTrip',   keys: ['1'] },
    { key: 'worldMessage',  badge: '2＋8', cue: 'LINE／RANDOM',  title: '朋友半夜打給你，他第一句話會說什麼？', field: 'worldMessage', keys: ['2', '8'] },
    { key: 'photo',         badge: '3',    cue: 'PHOTO',         title: '手機裡最新的照片',       field: 'photo', photo: true, keys: ['3'] },
    { key: 'shyQuestion',   badge: '4',    cue: 'SEARCH',        title: '不敢問出口的問題',       field: 'shyQuestion',  keys: ['4'] },
    { key: 'dislikedFood',  badge: '5',    cue: 'LETTER',        title: '最討厭吃的東西',         field: 'dislikedFood', keys: ['5'] },
    { key: 'song',          badge: '6',    cue: 'MUSIC',         title: 'KTV 拿手歌',             field: 'song',         keys: ['6'] },
    { key: 'impossibleJob', badge: '7',    cue: 'CARD',          title: '最不可能存在的職業',     field: 'impossibleJob', keys: ['7'] },
    { key: 'people',        badge: '名單', cue: '',              title: '桌號 × 暱稱',           render: (r) => r.nick, meta: (r) => r.table, keys: ['0'] },
  ]);

  const $ = (s) => document.querySelector(s);
  const responses = new Map();
  const samples = new Map();
  const photoRevealed = new Set();
  let activeKey = SECTIONS[0].key;
  let connected = null;

  function shuffled(items) {
    const out = items.slice();
    for (let i = out.length - 1; i > 0; i -= 1) { const j = Math.floor(Math.random() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
    return out;
  }
  function eligibleIds(section) {
    return [...responses.values()]
      .filter((r) => section.key === 'people' ? (r.nick && r.table) : typeof r[section.field] === 'string' && r[section.field].trim().length > 0)
      .map((r) => r.id);
  }
  // 抽樣穩定：只移除消失的、只補足不夠的；「換一批」才整批重抽
  function topUpSample(section, reset = false) {
    const pool = eligibleIds(section);
    const poolSet = new Set(pool);
    let current = reset ? [] : (samples.get(section.key) || []).filter((id) => poolSet.has(id));
    if (current.length < SAMPLE_SIZE) {
      const chosen = new Set(current);
      current = current.concat(shuffled(pool.filter((id) => !chosen.has(id))).slice(0, SAMPLE_SIZE - current.length));
    }
    samples.set(section.key, current);
    return current;
  }

  function renderStatus() {
    const total = responses.size;
    $('#status').innerHTML = `共 <b>${total}</b> 筆 · 每題隨機顯示 ${Math.min(SAMPLE_SIZE, total)}${connected === false ? '（離線）' : ''}`;
  }

  function renderTabs() {
    const nav = $('#tabs');
    nav.innerHTML = '';
    for (const section of SECTIONS) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = section.key === activeKey ? 'active' : '';
      b.innerHTML = `<span class="badge">${section.badge}</span><span class="cue">${section.cue || section.title}</span>`;
      b.addEventListener('click', () => { activeKey = section.key; renderAll(false); });
      nav.appendChild(b);
    }
  }

  function renderSection(reset = false) {
    const section = SECTIONS.find((s) => s.key === activeKey);
    const ids = topUpSample(section, reset);
    const root = $('#sections');
    root.innerHTML = '';
    const el = document.createElement('section');
    const head = document.createElement('div');
    head.className = 'head';
    head.innerHTML = `<span class="ttl"><b class="badge">${section.badge}</b>${section.cue ? `<span class="cue">${section.cue}</span>` : ''}<span class="q">${section.title}</span></span><small>顯示 ${ids.length} 筆</small>`;
    el.appendChild(head);
    const body = document.createElement('div');
    body.className = 'body';
    if (ids.length === 0) {
      body.innerHTML = '<div class="empty">還沒有人填這題</div>';
    } else if (section.photo && !photoRevealed.has(section.key)) {
      const gate = document.createElement('div'); gate.className = 'photo-gate';
      const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = `顯示照片（${ids.length} 張）`;
      btn.addEventListener('click', () => { photoRevealed.add(section.key); renderSection(); });
      gate.appendChild(btn); body.appendChild(gate);
    } else if (section.photo) {
      const grid = document.createElement('div'); grid.className = 'grid';
      for (const id of ids) {
        const r = responses.get(id);
        const fig = document.createElement('figure');
        const img = document.createElement('img'); img.loading = 'lazy'; img.decoding = 'async'; img.alt = r.nick; img.src = r.photo;
        const cap = document.createElement('figcaption'); cap.textContent = `${r.table} ${r.nick}`;
        fig.appendChild(img); fig.appendChild(cap); grid.appendChild(fig);
      }
      body.appendChild(grid);
    } else {
      const rows = document.createElement('div'); rows.className = 'rows';
      for (const id of ids) {
        const r = responses.get(id);
        const row = document.createElement('div'); row.className = 'row';
        const ans = document.createElement('span'); ans.className = 'ans'; ans.textContent = section.render ? section.render(r) : r[section.field];
        const meta = document.createElement('span'); meta.className = 'meta'; meta.textContent = section.meta ? section.meta(r) : `${r.table} ${r.nick}`;
        row.appendChild(ans); row.appendChild(meta); rows.appendChild(row);
      }
      body.appendChild(rows);
    }
    el.appendChild(body);
    root.appendChild(el);
    renderStatus();
  }

  function renderAll(reset) { renderTabs(); renderSection(reset); }
  function reshuffleAll() { samples.clear(); renderAll(true); }

  $('#reshuffleBtn').addEventListener('click', reshuffleAll);
  addEventListener('keydown', (e) => {
    if (e.target && typeof e.target.matches === 'function' && e.target.matches('input,textarea,select')) return;
    const hit = SECTIONS.find((s) => s.keys.includes(e.key));
    if (hit) { activeKey = hit.key; renderAll(false); }
    else if (e.key.toLowerCase() === 'r') reshuffleAll();
  });

  let renderTimer = null;
  function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(() => renderAll(false), 150); }

  async function boot() {
    renderAll(false);
    if (!(typeof isFirebaseConfigured === 'function' && isFirebaseConfigured())) {
      $('#notice').textContent = 'firebase-config.js 仍是佔位值，這頁沒有資料可看。';
      $('#notice').classList.add('show');
      $('#status').textContent = '未設定';
      return;
    }
    try {
      const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
      const dbm = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
      const db = dbm.getDatabase(initializeApp(firebaseConfig));
      const ref = dbm.ref(db, `rooms/${ROOM}/responses`);
      dbm.onChildAdded(ref, (snap) => { responses.set(snap.key, { id: snap.key, ...snap.val() }); scheduleRender(); });
      dbm.onChildChanged(ref, (snap) => { responses.set(snap.key, { id: snap.key, ...snap.val() }); scheduleRender(); });
      dbm.onChildRemoved(ref, (snap) => { responses.delete(snap.key); scheduleRender(); });
      dbm.onValue(dbm.ref(db, '.info/connected'), (snap) => { connected = snap.val() === true; renderStatus(); });
      await Promise.race([dbm.get(ref).catch(() => {}), new Promise((r) => setTimeout(r, 3000))]);
    } catch (_) {
      $('#notice').textContent = 'Firebase 連線失敗，請確認網路後重新整理。';
      $('#notice').classList.add('show');
    }
    renderAll(false);
  }
  boot();
  </script>
</body>
</html>
